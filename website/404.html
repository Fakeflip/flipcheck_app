<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 — FLIPCHECK</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    :root { --bg:#09090B; --panel:#18181B; --text:#fff; --muted:#8b8b93; --accent:#22c55e; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    .wrap { max-width: 420px; }
    .code { font-size: 88px; font-weight: 800; line-height: 1; letter-spacing: -2px; }
    .code span { color: var(--accent); }
    h1 { font-size: 20px; margin: 18px 0 8px; font-weight: 600; }
    p { color: var(--muted); font-size: 15px; line-height: 1.5; }
    a.btn {
      display: inline-block; margin-top: 26px; padding: 12px 22px;
      background: var(--accent); color: #06210f; font-weight: 600;
      text-decoration: none; border-radius: 10px; font-size: 15px;
    }
    a.btn:hover { filter: brightness(1.08); }
    .brand { margin-top: 40px; color: var(--muted); font-size: 12px; letter-spacing: 2px; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="code">4<span>0</span>4</div>
    <h1>Diese Seite gibt es nicht.</h1>
    <p>Die Seite wurde nicht gefunden oder ist derzeit nicht verfügbar.</p>
    <a class="btn" href="/deals">Zu den Deals</a>
    <div class="brand">FLIPCHECK</div>
  </main>
</body>
</html>
